<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e9f2"/></linearGradient>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a5596"/><stop offset="1" stop-color="#0a3363"/></linearGradient>
<clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0a2a55" flood-opacity="0.28"/></filter>
<filter id="ish" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/></filter>
</defs>
<g filter="url(#ish)">
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<g clip-path="url(#sq)">
<rect x="100" y="800" width="824" height="42" fill="#c6363c"/>
<rect x="100" y="842" width="824" height="42" fill="#0c4076"/>
<rect x="100" y="884" width="824" height="40" fill="#ffffff"/>
<rect x="100" y="884" width="824" height="2" fill="#d5dbe5"/>
</g>
</g>
<!-- signature stroke -->
<path d="M210 700 C 280 620, 330 760, 400 690 S 520 640, 560 700" fill="none" stroke="#0c4076" stroke-width="18" stroke-linecap="round"/>
<!-- fountain-pen nib -->
<g transform="rotate(40 600 420)" filter="url(#sh)">
<path d="M600 160 L720 300 L680 560 L600 680 L520 560 L480 300 Z" fill="url(#ink)"/>
<path d="M600 680 L600 470" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
<circle cx="600" cy="450" r="30" fill="#ffffff"/>
<rect x="470" y="170" width="260" height="70" rx="20" fill="#0a3363" transform="translate(0 -40)"/>
</g>
</svg>
